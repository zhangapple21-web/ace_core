name: ACE Verify Fixes

on:
  push:
  pull_request:

jobs:
  verify-fixes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run portable verify_fixes.py
        run: python ops/verify_fixes.py
        env:
          PYTHONIOENCODING: utf-8
